services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netconnect-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
    networks:
      - netconnect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netconnect-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - netconnect-network

networks:
  netconnect-network:
    driver: bridge
